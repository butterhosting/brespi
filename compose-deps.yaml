services:
  postgresql:
    image: "postgres:17"
    environment:
      POSTGRES_USER: "postgresql"
      POSTGRES_PASSWORD: "postgresql"
    ports:
      - "5432:5432"
    volumes:
      - ./seeds/postgresql:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgresql"]
      interval: 1s
      timeout: 10s
      retries: 10

  mariadb:
    image: "mariadb:11"
    environment:
      MARIADB_USER: "mariadb"
      MARIADB_PASSWORD: "mariadb"
      MARIADB_ROOT_PASSWORD: "root"
    ports:
      - "3306:3306"
    volumes:
      - ./seeds/mariadb:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 10s
      retries: 10

  s3:
    image: rustfs/rustfs
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: test
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/"]
      interval: 1s
      timeout: 10s
      retries: 10

  s3-setup:
    image: amazon/aws-cli
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: [""]
    command: ["aws", "--endpoint-url", "http://s3:9000", "s3", "mb", "s3://bucko"]

networks:
  app-network:
    driver: bridge
