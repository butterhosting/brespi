services:
  postgresql:
    image: "postgres:17"
    environment:
      POSTGRES_USER: "postgresql"
      POSTGRES_PASSWORD: "postgresql"
    ports:
      - "5432:5432"
    volumes:
      - ./seeds/postgresql:/docker-entrypoint-initdb.d
    networks:
      - app-network

  mariadb:
    image: "mariadb:11"
    environment:
      MARIADB_USER: "mariadb"
      MARIADB_PASSWORD: "mariadb"
      MARIADB_ROOT_PASSWORD: "root"
    ports:
      - "3306:3306"
    volumes:
      - ./seeds/mariadb:/docker-entrypoint-initdb.d
    networks:
      - app-network

  s3:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: "bucko"
    ports:
      - "9090:9090"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
