services:
  # Creates root-owned directories in the volume before brespi starts.
  # This simulates a real deployment where bind mounts or pre-existing
  # volumes are owned by root — the scenario where the entrypoint's
  # chown is actually needed.
  init:
    image: alpine
    volumes:
      - brespi:/opt/brespi
    command: ["sh", "-c", "mkdir -p /opt/brespi/data /opt/brespi/tmp"]

  brespi:
    image: brespi:latest
    ports:
      - "3000:3000"
    volumes:
      - brespi:/opt/brespi
      - ./.htpasswd:/opt/brespi/.htpasswd:ro
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  brespi:
