include:
  - compose-deps.yaml

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun start:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    environment:
      MY_ENCRYPTION_KEY: unicorn
      MY_POSTGRESQL_URL: postgresql://postgresql:postgresql@postgresql
      MY_MARIADB_URL: mariadb://mariadb:mariadb@mariadb:3306
      MY_S3_ACCESS_KEY: test
      MY_S3_SECRET_KEY: test
      MY_SLACK_WEBHOOK_URL: ${MY_SLACK_WEBHOOK_URL}
    networks:
      - app-network
    depends_on:
      postgresql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      s3_init:
        condition: service_completed_successfully
